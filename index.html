<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Emergency Command Center</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar glass">

        <h1 class="logo">🚑 RESCUENET</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report</a>
            <a href="rules.html">Rules</a>
            <a href="ai.html">AI Analysis</a>
            <a href="heatmap.html">Heatmap</a>
            <a href="dashboard.html">Responder Panel</a>
        </nav>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar glass">

            <div>
                <h2>AI Emergency Command Center</h2>
                <p>Real-time emergency response coordination</p>
            </div>

            <button id="sosBtn" class="sos-button">
                EMERGENCY SOS
            </button>

        </header>

        <!-- STATS -->
        <section class="dashboard-grid">

            <div class="card glass stat-card">
                <h3>Active Incidents</h3>
                <h1 id="incidentCount">12</h1>
            </div>

            <div class="card glass stat-card">
                <h3>Ambulances Active</h3>
                <h1>7</h1>
            </div>

            <div class="card glass stat-card">
                <h3>Risk Level</h3>
                <h1 class="danger-text">HIGH</h1>
            </div>

            <div class="card glass stat-card">
                <h3>AI Confidence</h3>
                <h1 id="confidence">93%</h1>
            </div>

        </section>

        <!-- MAP -->
        <section class="map-section glass">
            <div id="map"></div>
        </section>

        <!-- AI ANALYSIS -->
        <section class="glass ai-panel">

            <h2>🤖 AI Emergency Analysis</h2>

            <input
                type="text"
                id="emergencyInput"
                placeholder="Describe emergency..."
            >

            <button onclick="runAIAnalysis()">
                Analyze Emergency
            </button>

            <div id="aiResult"></div>

        </section>

        <!-- PANELS -->
        <section class="panels-grid">

            <div class="glass panel">
                <h2>Emergency Timeline</h2>
                <ul id="timeline"></ul>
            </div>

            <div class="glass panel">
                <h2>Live Incidents</h2>
                <div id="incidentFeed"></div>
            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>
<script type="module" src="assets/js/app.js"></script>

</body>
</html>
