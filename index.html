<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RescueNet</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <h2 class="logo">🚑 RescueNet</h2>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="report.html">Report</a>

            <a href="rules.html">Rules</a>

            <a href="ai.html">AI</a>

        </div>

    </nav>

    <div class="container">

        <h1 class="main-title">
            RescueNet
        </h1>

        <p class="tagline">
            Smart Emergency Assistance & Road Safety Platform
        </p>

        <!-- EMERGENCY CONTACT -->

        <div class="contact-box">

            <h2>
                Emergency Contact
            </h2>

            <input type="text"
                   id="contactNumber"
                   placeholder="Enter WhatsApp Number with Country Code">

        </div>

        <!-- BUTTONS -->

        <div class="button-container">

            <button class="sos-btn"
                    onclick="findHelp()">

                🚑 SOS Emergency

            </button>

            <button class="normal-btn"
                    onclick="window.location.href='report.html'">

                🛣️ Report Road Issue

            </button>

            <button class="normal-btn"
                    onclick="window.location.href='rules.html'">

                📜 Traffic Rules

            </button>

            <button class="normal-btn"
                    onclick="window.location.href='ai.html'">

                🤖 AI Assistant

            </button>

        </div>

        <h3 class="footer-text">

            “Because every second matters.”

        </h3>

    </div>

    <script src="script.js"></script>

</body>

</html>
