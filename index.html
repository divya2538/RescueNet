<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueNet AI Command Center</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="app-container">

  <aside class="sidebar">
    <h1 class="logo">RESCUENET</h1>

    <nav>
      <a href="#">Dashboard</a>
      <a href="#">Emergency Map</a>
      <a href="#">AI Analysis</a>
      <a href="#">Heatmap</a>
      <a href="#">Reports</a>
      <a href="#">Dispatch</a>
      <a href="dashboard.html">Responder Panel</a>
    </nav>
  </aside>

  <main class="main-content">

    <header class="topbar glass">
      <div>
        <h2>AI Emergency Command Center</h2>
        <p>Real-time emergency response coordination</p>
      </div>

      <button id="sosBtn" class="sos-button">
        EMERGENCY SOS
      </button>
    </header>

    <section class="dashboard-grid">

      <div class="card glass stat-card">
        <h3>Active Incidents</h3>
        <h1 id="incidentCount">12</h1>
      </div>

      <div class="card glass stat-card">
        <h3>Ambulances Active</h3>
        <h1>7</h1>
      </div>

      <div class="card glass stat-card">
        <h3>Risk Level</h3>
        <h1 class="danger-text">HIGH</h1>
      </div>

      <div class="card glass stat-card">
        <h3>AI Confidence</h3>
        <h1 id="confidence">93%</h1>
      </div>

    </section>

    <section class="map-section glass">
      <div id="map"></div>
    </section>

    <section class="panels-grid">

</html
