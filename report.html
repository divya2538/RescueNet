<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Issue</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <nav>

        <h2 class="logo">🚑 RescueNet AI</h2>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="report.html">Report</a>
            <a href="rules.html">Rules</a>
            <a href="ai.html">AI</a>

        </div>

    </nav>

    <div class="container">

        <h1 class="main-title">
            Smart Hazard Reporting
        </h1>

        <div class="report-box">

            <input type="text"
                   id="reporterName"
                   placeholder="Your Name">

            <select id="issueType">

                <option>Pothole</option>
                <option>Flooded Road</option>
                <option>Broken Signal</option>
                <option>Accident Zone</option>
                <option>Traffic Block</option>

            </select>

            <textarea id="issueDescription"
            placeholder="Describe issue">
            </textarea>

            <input type="file">

            <button onclick="getLocation()">
                📍 Detect Location
            </button>

            <p id="locationText">
                Location not detected
            </p>

            <button onclick="submitReport()">
                🚨 Submit Report
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
