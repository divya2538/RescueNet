<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <nav>

        <h2 class="logo">🚑 RescueNet AI</h2>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="report.html">Report</a>
            <a href="rules.html">Rules</a>
            <a href="ai.html">AI</a>

        </div>

    </nav>

    <div class="container">

        <h1 class="main-title">
            AI Emergency Assistant
        </h1>

        <div class="rules-box">

            <textarea id="emergencyInput"
            placeholder="Describe emergency...">
            </textarea>

            <button onclick="startVoice()">
                🎤 Voice Input
            </button>

            <button onclick="checkEmergency()">
                🤖 Analyze Emergency
            </button>

        </div>

        <div class="dashboard-grid">

            <div class="glass-card">

                <h3>🚨 Severity</h3>

                <p id="severity">
                    Waiting...
                </p>

            </div>

            <div class="glass-card">

                <h3>🏥 Recommendation</h3>

                <p id="recommendation">
                    Waiting...
                </p>

            </div>

            <div class="glass-card">

                <h3>📍 Services</h3>

                <p id="services">
                    Waiting...
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
